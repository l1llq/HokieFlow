# Deploys HokieFlow to Azure App Service (hokie-5132) on every push to master.
#
# HOW IT WORKS
#   azure/webapps-deploy ships the repo source to the App Service; the remote
#   Oryx builder then runs `pip install -r requirements.txt` because the app
#   setting SCM_DO_BUILD_DURING_DEPLOYMENT=true is configured in Azure.
#
# REQUIRED SECRET (GitHub -> Settings -> Secrets and variables -> Actions)
#   AZURE_PUBLISH_PROFILE — full XML from Azure portal:
#   App Service -> Overview -> Get publish profile (download, paste entire file)
#
# RUNTIME CONTRACT (configured in Azure -> Configuration):
#   Startup command: python3 -m app.server --host 0.0.0.0 --port ${PORT:-8000}
#   Always On: On
name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity-check Python entry points
        run: |
          python3 --version
          python3 -m py_compile app/server.py app/ui_files.py app/__init__.py 2>/dev/null \
            || python3 -m py_compile app/server.py app/ui_files.py
          test -f requirements.txt
          test -f app/server.py
          test -d ui

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: hokie-5132
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: .
